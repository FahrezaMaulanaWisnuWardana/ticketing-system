name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticketing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ticketing_test
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: reverb
      TELESCOPE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, gd, intl, zip, bcmath
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate composer
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install JS dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Pint
        run: ./vendor/bin/pint --test
      - name: Larastan (level 8)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pest
        run: ./vendor/bin/pest --colors=never --coverage
      - name: Migration fresh + rollback
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Composer audit
        run: composer audit
      - name: NPM audit
        run: npm audit --omit=dev --audit-level=high
      - name: Docker build
        run: docker build -f docker/prod/Dockerfile -t ticketing:ci .

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: echo "Configure registry credentials and push ${{ github.sha }} in your CI environment."
      - name: Deploy to staging
        run: echo "Run ./deploy.sh staging ${{ github.sha }}"
