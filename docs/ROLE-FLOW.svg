<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1400" width="1440" height="1400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowHand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1400" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Alur Kerja per Role — Internal Ticketing System</text>
  <text x="40" y="82" font-size="15" fill="#64748b">Dari login sampai tiket selesai. Panah padat = langkah dalam peran · Panah putus-putus = serah terima antar peran.</text>

  <!-- LEGEND -->
  <line x1="40" y1="108" x2="90" y2="108" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="100" y="113" font-size="12.5" fill="#64748b">langkah dalam peran</text>
  <line x1="270" y1="108" x2="320" y2="108" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowHand)"/>
  <text x="330" y="113" font-size="12.5" fill="#64748b">handoff antar peran</text>

  <!-- ================= LANE 1 : PEMINTA ================= -->
  <rect x="40" y="130" width="1360" height="230" rx="16" fill="#f0fdfa" stroke="#ccfbf1"/>
  <rect x="40" y="130" width="10" height="230" fill="#0d9488"/>
  <rect x="62" y="198" width="146" height="96" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="135" y="234" text-anchor="middle" font-size="30">🙋</text>
  <text x="135" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#115e59">Peminta</text>
  <text x="135" y="278" text-anchor="middle" font-size="11" fill="#0f766e">role: requester</text>
  <text x="62" y="160" font-size="14" font-weight="700" fill="#0f766e">1 · PENGGUNA PELAPOR</text>

  <g>
    <rect x="230" y="185" width="210" height="120" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="335" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">1. Masuk</text>
    <text x="335" y="243" text-anchor="middle" font-size="11.5" fill="#475569">Email / Google /</text>
    <text x="335" y="261" text-anchor="middle" font-size="11.5" fill="#475569">tautan undangan</text>

    <rect x="470" y="185" width="210" height="120" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="575" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">2. Buat permintaan</text>
    <text x="575" y="243" text-anchor="middle" font-size="11.5" fill="#475569">Pilih kartu jenis,</text>
    <text x="575" y="261" text-anchor="middle" font-size="11.5" fill="#475569">isi judul + deskripsi</text>

    <rect x="710" y="185" width="210" height="120" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="815" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">3. Pantau tiket</text>
    <text x="815" y="243" text-anchor="middle" font-size="11.5" fill="#475569">Permintaan saya:</text>
    <text x="815" y="261" text-anchor="middle" font-size="11.5" fill="#475569">filter &amp; status</text>

    <rect x="950" y="185" width="210" height="120" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text x="1055" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">4. Balas / buka ulang</text>
    <text x="1055" y="243" text-anchor="middle" font-size="11.5" fill="#475569">Balas bila diminta;</text>
    <text x="1055" y="261" text-anchor="middle" font-size="11.5" fill="#475569">buka ulang ≤ 7 hari</text>

    <rect x="1190" y="185" width="210" height="120" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="1295" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">5. Terima notifikasi</text>
    <text x="1295" y="243" text-anchor="middle" font-size="11.5" fill="#475569">Perubahan status</text>
    <text x="1295" y="261" text-anchor="middle" font-size="11.5" fill="#475569">secara real-time</text>
  </g>
  <line x1="440" y1="245" x2="470" y2="245" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="245" x2="710" y2="245" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="245" x2="950" y2="245" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1160" y1="245" x2="1190" y2="245" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= LANE 2 : AGEN ================= -->
  <rect x="40" y="440" width="1360" height="230" rx="16" fill="#faf5ff" stroke="#ede9fe"/>
  <rect x="40" y="440" width="10" height="230" fill="#7c3aed"/>
  <rect x="62" y="508" width="146" height="96" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="135" y="544" text-anchor="middle" font-size="30">🎧</text>
  <text x="135" y="568" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Agen</text>
  <text x="135" y="588" text-anchor="middle" font-size="11" fill="#6d28d9">role: agent</text>
  <text x="62" y="470" font-size="14" font-weight="700" fill="#6d28d9">2 · PENANGANI TIKET</text>

  <g>
    <rect x="230" y="495" width="210" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="335" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">1. Antrean</text>
    <text x="335" y="553" text-anchor="middle" font-size="11.5" fill="#475569">5 antrean + jumlah</text>
    <text x="335" y="571" text-anchor="middle" font-size="11.5" fill="#475569">tiket</text>

    <rect x="470" y="495" width="210" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="575" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">2. Ambil tiket</text>
    <text x="575" y="553" text-anchor="middle" font-size="11.5" fill="#475569">Shortcut A atau</text>
    <text x="575" y="571" text-anchor="middle" font-size="11.5" fill="#475569">bulk assign</text>

    <rect x="710" y="495" width="210" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="815" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">3. Balas &amp; catatan</text>
    <text x="815" y="553" text-anchor="middle" font-size="11.5" fill="#475569">Balas publik /</text>
    <text x="815" y="571" text-anchor="middle" font-size="11.5" fill="#475569">catatan internal</text>

    <rect x="950" y="495" width="210" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1055" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">4. Ubah status</text>
    <text x="1055" y="553" text-anchor="middle" font-size="11.5" fill="#475569">Baru → Proses →</text>
    <text x="1055" y="571" text-anchor="middle" font-size="11.5" fill="#475569">Menunggu → Selesai</text>

    <rect x="1190" y="495" width="210" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1295" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">5. Jaga SLA</text>
    <text x="1295" y="553" text-anchor="middle" font-size="11.5" fill="#475569">Target respons &amp;</text>
    <text x="1295" y="571" text-anchor="middle" font-size="11.5" fill="#475569">resolusi</text>
  </g>
  <line x1="440" y1="555" x2="470" y2="555" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="555" x2="710" y2="555" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="555" x2="950" y2="555" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1160" y1="555" x2="1190" y2="555" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HANDOFFS lane 1 <-> lane 2 -->
  <line x1="575" y1="305" x2="335" y2="495" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowHand)"/>
  <rect x="392" y="386" width="150" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="467" y="401" text-anchor="middle" font-size="11" fill="#475569">tiket baru masuk</text>

  <line x1="815" y1="495" x2="1055" y2="305" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowHand)"/>
  <rect x="868" y="386" width="158" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="947" y="401" text-anchor="middle" font-size="11" fill="#475569">butuh balasan peminta</text>

  <line x1="1295" y1="495" x2="1295" y2="305" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowHand)"/>
  <rect x="1210" y="386" width="170" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1295" y="401" text-anchor="middle" font-size="11" fill="#475569">selesai → notifikasi</text>

  <!-- ================= LANE 3 : PROJECT LEAD ================= -->
  <rect x="40" y="750" width="1360" height="230" rx="16" fill="#fff1f2" stroke="#ffe4e6"/>
  <rect x="40" y="750" width="10" height="230" fill="#e11d48"/>
  <rect x="62" y="818" width="146" height="96" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="135" y="854" text-anchor="middle" font-size="30">📋</text>
  <text x="135" y="878" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Project Lead</text>
  <text x="135" y="898" text-anchor="middle" font-size="11" fill="#be123c">role proyek: lead</text>
  <text x="62" y="780" font-size="14" font-weight="700" fill="#be123c">3 · PENGELOLA PROYEK</text>

  <g>
    <rect x="230" y="805" width="210" height="120" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <text x="335" y="836" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">= Hak agen penuh</text>
    <text x="335" y="863" text-anchor="middle" font-size="11.5" fill="#475569">Antrean, balasan,</text>
    <text x="335" y="881" text-anchor="middle" font-size="11.5" fill="#475569">status &amp; prioritas</text>

    <rect x="470" y="805" width="210" height="120" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <text x="575" y="836" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Kelola tim</text>
    <text x="575" y="863" text-anchor="middle" font-size="11.5" fill="#475569">Anggota &amp; kategori</text>
    <text x="575" y="881" text-anchor="middle" font-size="11.5" fill="#475569">proyek</text>

    <rect x="710" y="805" width="210" height="120" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <text x="815" y="836" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Balasan siap pakai</text>
    <text x="815" y="863" text-anchor="middle" font-size="11.5" fill="#475569">Atur canned reply</text>
    <text x="815" y="881" text-anchor="middle" font-size="11.5" fill="#475569">untuk proyek</text>

    <rect x="950" y="805" width="210" height="120" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <text x="1055" y="836" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Board &amp; sprint</text>
    <text x="1055" y="863" text-anchor="middle" font-size="11.5" fill="#475569">Backlog, kanban,</text>
    <text x="1055" y="881" text-anchor="middle" font-size="11.5" fill="#475569">laporan, ringkasan</text>
  </g>
  <line x1="440" y1="865" x2="470" y2="865" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="865" x2="710" y2="865" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="865" x2="950" y2="865" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HANDOFF lane 2 -> lane 3 -->
  <line x1="1055" y1="615" x2="1055" y2="805" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowHand)"/>
  <rect x="968" y="696" width="174" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1055" y="711" text-anchor="middle" font-size="11" fill="#475569">tiket dev → board/sprint</text>

  <!-- ================= LANE 4 : ADMIN ================= -->
  <rect x="40" y="1060" width="1360" height="230" rx="16" fill="#fffbeb" stroke="#fef3c7"/>
  <rect x="40" y="1060" width="10" height="230" fill="#d97706"/>
  <rect x="62" y="1128" width="146" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="135" y="1164" text-anchor="middle" font-size="30">⚙️</text>
  <text x="135" y="1188" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Admin</text>
  <text x="135" y="1208" text-anchor="middle" font-size="11" fill="#b45309">role: admin</text>
  <text x="62" y="1090" font-size="14" font-weight="700" fill="#b45309">4 · ADMINISTRATOR (AKSES PENUH)</text>

  <g>
    <rect x="230" y="1115" width="210" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="335" y="1146" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">1. Masuk + 2FA</text>
    <text x="335" y="1173" text-anchor="middle" font-size="11.5" fill="#475569">TOTP wajib saat</text>
    <text x="335" y="1191" text-anchor="middle" font-size="11.5" fill="#475569">REQUIRE_ADMIN_2FA</text>

    <rect x="470" y="1115" width="210" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="575" y="1146" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">2. Kelola pengguna</text>
    <text x="575" y="1173" text-anchor="middle" font-size="11.5" fill="#475569">Undang, impor CSV,</text>
    <text x="575" y="1191" text-anchor="middle" font-size="11.5" fill="#475569">nonaktif, reset 2FA</text>

    <rect x="710" y="1115" width="210" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="815" y="1146" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">3. Proyek &amp; kategori</text>
    <text x="815" y="1173" text-anchor="middle" font-size="11.5" fill="#475569">Skema form, balasan</text>
    <text x="815" y="1191" text-anchor="middle" font-size="11.5" fill="#475569">global</text>

    <rect x="950" y="1115" width="210" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="1055" y="1146" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">4. SLA &amp; aturan</text>
    <text x="1055" y="1173" text-anchor="middle" font-size="11.5" fill="#475569">Jam kerja, libur,</text>
    <text x="1055" y="1191" text-anchor="middle" font-size="11.5" fill="#475569">auto-close</text>

    <rect x="1190" y="1115" width="210" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1295" y="1146" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">5. Audit &amp; health</text>
    <text x="1295" y="1173" text-anchor="middle" font-size="11.5" fill="#475569">Log audit, Horizon,</text>
    <text x="1295" y="1191" text-anchor="middle" font-size="11.5" fill="#475569">backup/restore</text>
  </g>
  <line x1="440" y1="1175" x2="470" y2="1175" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="1175" x2="710" y2="1175" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="1175" x2="950" y2="1175" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1160" y1="1175" x2="1190" y2="1175" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- FOOTER NOTE -->
  <rect x="40" y="1320" width="1360" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="1352" font-size="13" fill="#475569">Catatan: Admin menyiapkan akun, proyek, kategori &amp; SLA yang dipakai semua peran · Project Lead = agent + role <tspan font-weight="700">lead</tspan> pada satu proyek · Anggota biasa = role proyek <tspan font-weight="700">member</tspan> (hak setara agen, tanpa kelola proyek).</text>
</svg>
