<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1700" width="1460" height="1700" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1460" height="1700" fill="#ffffff"/>
  <text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Ticketing System — Application Flow</text>
  <text x="40" y="88" font-size="15" fill="#64748b">Internal helpdesk + dev-work tracker + project manager · Laravel 13 / Livewire 3 / PostgreSQL / Reverb</text>

  <!-- BAND A: SIGN IN -->
  <rect x="40" y="110" width="1380" height="215" rx="16" fill="#eff6ff" stroke="#dbeafe"/>
  <rect x="40" y="110" width="12" height="215" fill="#3b82f6"/>
  <text x="72" y="142" font-size="16" font-weight="700" fill="#1d4ed8">1   SIGN IN</text>

  <rect x="90" y="165" width="250" height="56" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="199" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Email / Password</text>

  <rect x="370" y="165" width="250" height="56" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="495" y="199" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Google OAuth</text>

  <rect x="650" y="165" width="280" height="56" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="790" y="199" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Invite link → set password</text>

  <rect x="430" y="250" width="260" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">2FA challenge (TOTP)</text>

  <text x="980" y="190" font-size="14" fill="#475569">• Inactive users blocked</text>
  <text x="980" y="218" font-size="14" fill="#475569">• Verified email + domain allowlist</text>

  <line x1="215" y1="221" x2="545" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="221" x2="555" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="221" x2="575" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- BAND B: CREATE -->
  <rect x="40" y="345" width="1380" height="460" rx="16" fill="#f0fdfa" stroke="#ccfbf1"/>
  <rect x="40" y="345" width="12" height="460" fill="#0d9488"/>
  <text x="72" y="377" font-size="16" font-weight="700" fill="#0f766e">2   CREATE A TICKET</text>

  <rect x="520" y="400" width="420" height="54" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="730" y="433" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">Home Dashboard (role-aware)</text>

  <rect x="520" y="485" width="420" height="54" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="730" y="518" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">+ Create Ticket  ·  Quick modal / full form</text>

  <rect x="520" y="570" width="420" height="54" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="730" y="603" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">Choose Project + Kind  ·  Request or Dev</text>

  <rect x="520" y="655" width="420" height="54" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="730" y="688" text-anchor="middle" font-size="15" font-weight="700" fill="#115e59">CreateTicket  ·  key • status • SLA</text>

  <rect x="520" y="740" width="420" height="54" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="730" y="773" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">Confirmation Page (SLA target shown)</text>

  <line x1="560" y1="306" x2="700" y2="400" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="454" x2="730" y2="485" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="539" x2="730" y2="570" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="624" x2="730" y2="655" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="709" x2="730" y2="740" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- BAND C: PROCESSING -->
  <rect x="40" y="825" width="670" height="560" rx="16" fill="#faf5ff" stroke="#ede9fe"/>
  <rect x="40" y="825" width="12" height="560" fill="#7c3aed"/>
  <text x="72" y="857" font-size="16" font-weight="700" fill="#6d28d9">3a  REQUEST FLOW (HELPDESK)</text>

  <rect x="70" y="880" width="610" height="54" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="375" y="913" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">Agent Queue · unassigned requests</text>

  <rect x="70" y="965" width="610" height="54" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="375" y="998" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">Self-assign (A)</text>

  <rect x="70" y="1050" width="610" height="64" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="375" y="1085" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">
    <tspan x="375">Conversation · public reply / internal note</tspan>
    <tspan x="375" dy="20">change status &amp; priority</tspan>
  </text>

  <rect x="70" y="1140" width="610" height="64" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="375" y="1175" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">
