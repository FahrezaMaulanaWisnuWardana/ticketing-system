  <text x="375" y="1275" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">
    <tspan x="375">Status lifecycle</tspan>
    <tspan x="375" dy="20">New → In Progress → In Review → Done → Closed</tspan>
  </text>

  <line x1="730" y1="794" x2="375" y2="880" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="934" x2="375" y2="965" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="1019" x2="375" y2="1050" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="1114" x2="375" y2="1140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="1204" x2="375" y2="1240" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="720" y="825" width="700" height="560" rx="16" fill="#fff1f2" stroke="#ffe4e6"/>
  <rect x="720" y="825" width="12" height="560" fill="#e11d48"/>
  <text x="752" y="857" font-size="16" font-weight="700" fill="#be123c">3b  DEV WORK FLOW</text>

  <rect x="750" y="880" width="640" height="54" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <text x="1070" y="913" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">Dev ticket</text>

  <rect x="750" y="965" width="640" height="54" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <text x="1070" y="998" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">Backlog</text>

  <rect x="750" y="1050" width="640" height="64" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <text x="1070" y="1085" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">
    <tspan x="1070">Kanban Board (drag &amp; drop)</tspan>
    <tspan x="1070" dy="20">Todo → In Progress → In Review → Done</tspan>
  </text>

  <rect x="750" y="1140" width="640" height="64" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <text x="1070" y="1175" text-anchor="middle" font-size="15" font-weight="600" fill="#9f1239">
    <tspan x="1070">Sprints</tspan>
    <tspan x="1070" dy="20">create · start · complete</tspan>
  </text>

  <rect x="750" y="1240" width="640" height="64" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="1070" y="1275" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">
    <tspan x="1070">Reports</tspan>
    <tspan x="1070" dy="20">overview · timeline · workload · CSV export</tspan>
  </text>

  <line x1="730" y1="794" x2="1070" y2="880" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="934" x2="1070" y2="965" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="1019" x2="1070" y2="1050" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="1114" x2="1070" y2="1140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1070" y1="1204" x2="1070" y2="1240" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- dashed: writes emit events -->
  <line x1="375" y1="1304" x2="320" y2="1465" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <line x1="1070" y1="1304" x2="470" y2="1465" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- BAND D: SYSTEM / ASYNC -->
  <rect x="40" y="1405" width="1380" height="265" rx="16" fill="#fffbeb" stroke="#fef3c7"/>
  <rect x="40" y="1405" width="12" height="265" fill="#d97706"/>
  <text x="72" y="1437" font-size="16" font-weight="700" fill="#b45309">4   SYSTEM / ASYNC</text>

  <rect x="90" y="1465" width="470" height="70" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="325" y="1498" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">
    <tspan x="325">Domain Events</tspan>
    <tspan x="325" dy="20" font-size="13" font-weight="500">Created · Commented · StatusChanged · Assigned · Reopened</tspan>
  </text>

  <rect x="90" y="1560" width="470" height="54" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="325" y="1593" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Debounced Dispatcher (60s)</text>

  <rect x="620" y="1460" width="190" height="50" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="715" y="1490" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Email</text>

  <rect x="620" y="1525" width="190" height="50" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="715" y="1555" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Database</text>

  <rect x="620" y="1590" width="190" height="50" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="715" y="1620" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Realtime (Reverb)</text>

  <rect x="870" y="1460" width="280" height="50" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1010" y="1490" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Trello · two-way sync</text>

  <rect x="870" y="1525" width="280" height="50" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1010" y="1555" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Git webhooks → auto-close</text>

  <text x="870" y="1608" font-size="13" fill="#78716c">App remains the source of truth</text>

  <line x1="325" y1="1535" x2="325" y2="1560" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="1587" x2="620" y2="1485" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="1587" x2="620" y2="1550" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
