services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ticketing}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      BROADCAST_CONNECTION: reverb
    volumes:
      - .:/var/www
      - ./docker/dev/php.ini:/usr/local/etc/php/conf.d/99-ticketing.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - .:/var/www:ro
      - ./docker/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - app
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      SKIP_MIGRATE: "1"
    volumes:
      - .:/var/www
    depends_on:
      - app
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      SKIP_MIGRATE: "1"
    volumes:
      - .:/var/www
    depends_on:
      - app
    command: php artisan schedule:work
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      SKIP_MIGRATE: "1"
    volumes:
      - .:/var/www
    depends_on:
      - app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose:
      - "8080"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles:
      - minio
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    profiles:
      - vite

volumes:
  postgres_data:
  redis_data:
  minio_data:
